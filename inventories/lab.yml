# Lab inventory skeleton (T-000). Connection details only; credentials come
# from Vault at runtime (INV-001) and never appear here.
all:
  children:
    lab:
      children:
        ios:
          hosts:
            lab-sw01:
              ansible_host: 10.0.0.11
            lab-sw02:
              ansible_host: 10.0.0.12
          vars:
            ansible_network_os: ios
            ansible_connection: network_cli
            ansible_become: true
            ansible_become_method: enable
      vars:
        # Vault value wins when provided; placeholder keeps device-less gate
        # runs working without a live secret (ACR-001). No connection opens
        # in render-only mode.
        ansible_user: "{{ vault_lab_user | default('netaut') }}"
