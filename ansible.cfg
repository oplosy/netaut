# Ansible control-node defaults (T-000). No secrets in this file (INV-001).
[defaults]
inventory = inventories/lab.yml
retry_files_enabled = False
diff_always = True
forks = 10
timeout = 30
vault_password_file = .vault_pass
collections_path = ./collections

[privilege_escalation]
become = False

[persistent_connection]
connect_timeout = 30
command_timeout = 60
