# Ansible control-node defaults (T-000). No secrets in this file (INV-001).
[defaults]
inventory = inventories/lab.yml
retry_files_enabled = False
diff_always = True
forks = 10
timeout = 30
# No vault_password_file here by policy (INV-001, ACR-002): pass
# --vault-password-file at runtime or set ANSIBLE_VAULT_PASSWORD_FILE.
collections_path = ./collections

[privilege_escalation]
become = False

[persistent_connection]
connect_timeout = 30
command_timeout = 60
