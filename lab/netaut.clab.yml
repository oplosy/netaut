# Free live lab (T-009, ADR-006). The cEOS image is imported locally by the
# OWNER and never committed: docker import cEOS64-lab-<ver>.tar.xz ceos:<ver>
name: netaut
mgmt:
  network: netaut-mgmt
  ipv4-subnet: 172.20.20.0/24
topology:
  kinds:
    arista_ceos:
      image: ${CEOS_IMAGE:=ceos:latest}
  nodes:
    lab-sw01:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.11
    lab-sw02:
      kind: arista_ceos
      mgmt-ipv4: 172.20.20.12
  links:
    - endpoints: ["lab-sw01:eth1", "lab-sw02:eth1"]
