id: T-005
title: CI gates plus audit evidence and secret scan
implements: [REQ-007]
preserves: [INV-001]
addresses: [OPS-002, RISK-002]
baseline: v1
depends_on: [T-003, T-004]
owns:
  - .github/
  - scripts/
must_not_touch:
  - roles/
  - templates/
  - netbox/
  - inventories/
shared_owner: false
risk: MODERATE
review_required: false
objective: >
  CI pipeline enforcing lint, render, test and dry-run gates with secret scan
  and per-change audit record (commit, requester, diff, result).
acceptance:
  - id: A1
    text: CI workflow syntax-validates and lint passes on sample change.
    verified_by: V1
  - id: A2
    text: Secret scan blocks seeded credential with masked output.
    verified_by: V2
verify:
  - id: V1
    cmd: python scripts/ci_gate.py --sample netbox/intended/sample.yml
    expect: exit 0
  - id: V2
    cmd: python scripts/secret_scan.py --root .
    expect: exit 0
out_of_scope:
  - Production CI runners and credentials
  - Release publishing (needs license decision ASM-003)
