---
# IOS module calls for common settings (T-001, T-008 split). Module arguments only (INV-003).
- name: Configure NTP servers
  cisco.ios.ios_ntp_global:
    config:
      servers:
        - server: "{{ item }}"
    state: "{{ netaut_module_state }}"
  loop: "{{ netaut_common.ntp_servers }}"

# ios_system is a legacy module (no config key, no rendered state): the
# device-less proof skips it; waves (merged) always apply it.
- name: Configure DNS name servers
  cisco.ios.ios_system:
    name_servers: "{{ netaut_common.dns_servers }}"
  when: netaut_module_state == 'merged'

- name: Configure syslog hosts
  cisco.ios.ios_logging_global:
    config:
      hosts:
        - hostname: "{{ item }}"
    state: "{{ netaut_module_state }}"
  loop: "{{ netaut_common.syslog_servers }}"
