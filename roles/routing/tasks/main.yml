---
# Static + policy business logic (T-007). Module arguments only: no Jinja2
# template syntax and no raw CLI strings here (INV-003).
# Vendor module calls live in tasks/<vendor>.yml (T-008 dispatch). Raw rendering lives
# in templates/ios/routing/ and must produce the same effective config.
- name: Require routing inputs from intended state (fail closed)
  ansible.builtin.assert:
    that:
      - netaut_static_routes is sequence
      - netaut_prefix_lists is sequence
      - netaut_route_maps is sequence
    fail_msg: "routing inputs must be set from intended state"

- name: Require a supported vendor (fail closed)
  ansible.builtin.assert:
    that:
      - netaut_vendor in ['ios', 'eos']
    fail_msg: "no routing implementation for vendor {{ netaut_vendor }}"

- name: Apply vendor module calls
  ansible.builtin.include_tasks: "{{ netaut_vendor }}.yml"
