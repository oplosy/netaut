---
# Static + policy business logic (T-007). Module arguments only: no Jinja2
# template syntax and no raw CLI strings here (INV-003). Raw rendering lives
# in templates/ios/routing/ and must produce the same effective config.
- name: Require routing inputs from intended state (fail closed)
  ansible.builtin.assert:
    that:
      - netaut_static_routes is sequence
      - netaut_prefix_lists is sequence
      - netaut_route_maps is sequence
    fail_msg: "routing inputs must be set from intended state"

- name: Ensure static routes exist
  cisco.ios.ios_static_routes:
    config:
      - address_families:
          - afi: ipv4
            routes:
              - dest: "{{ item.prefix }}"
                next_hops:
                  - forward_router_address: "{{ item.next_hop }}"
                    name: "{{ item.name | default(omit) }}"
    state: merged
  loop: "{{ netaut_static_routes }}"

- name: Ensure prefix lists exist
  cisco.ios.ios_prefix_lists:
    config:
      - afi: ipv4
        prefix_lists:
          - name: "{{ item.0.name }}"
            description: "{{ item.0.description | default(omit) }}"
            entries:
              - action: "{{ item.1.action }}"
                prefix: "{{ item.1.prefix }}"
                sequence: "{{ item.1.seq }}"
    state: merged
  loop: "{{ netaut_prefix_lists | subelements('sequences') }}"

- name: Ensure route maps exist
  cisco.ios.ios_route_maps:
    config:
      - route_map: "{{ item.0.name }}"
        entries:
          - action: "{{ item.1.action }}"
            sequence: "{{ item.1.seq }}"
            match:
              ip:
                address:
                  prefix_lists:
                    - "{{ item.1.match_prefix_list }}"
    state: merged
  loop: "{{ netaut_route_maps | subelements('sequences') }}"
