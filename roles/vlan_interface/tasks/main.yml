---
# VLAN/interface business logic (T-002). Module arguments only: no Jinja2
# template syntax and no raw CLI strings here (INV-003).
# Vendor module calls live in tasks/<vendor>.yml (T-008 dispatch). Raw rendering lives
# in templates/<vendor>/ and must produce the same effective config.
- name: Require VLAN and interface inputs from intended state (fail closed)
  ansible.builtin.assert:
    that:
      - netaut_vlans is sequence
      - netaut_vlans | length > 0
      - netaut_interfaces is sequence
      - netaut_interfaces | length > 0
    fail_msg: "netaut_vlans and netaut_interfaces must be set from intended state"

- name: Require a supported vendor (fail closed)
  ansible.builtin.assert:
    that:
      - netaut_vendor in ['ios', 'eos', 'srlinux']
    fail_msg: "no vlan_interface implementation for vendor {{ netaut_vendor }}"

- name: Apply vendor module calls
  ansible.builtin.include_tasks: "{{ netaut_vendor }}.yml"
