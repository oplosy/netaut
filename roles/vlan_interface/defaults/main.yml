---
# Inputs come from intended state (netbox/intended/*.yml). Null defaults fail
# closed in the role pre-assert; the role never invents VLANs (INV-004).
netaut_vlans: null
netaut_interfaces: null
# Vendor dispatch (T-008): ios | eos, from ansible_network_os.
netaut_vendor: "{{ ansible_network_os | default('') | split('.') | last }}"
# merged for waves; the device-less proof sets rendered.
netaut_module_state: merged
