---
# Live post-check (T-010): device running-config -> operational snapshot ->
# drift against intended state. Only rc 0 passes; drift (2) or error (1)
# fails the wave and triggers rollback.
- name: Require a vendor with a live implementation (fail closed)
  ansible.builtin.assert:
    that:
      - netaut_vendor in ['eos', 'srlinux']
    fail_msg: "live_guard: no live implementation for vendor {{ netaut_vendor }}"

- name: Require a wave id (fail closed)
  ansible.builtin.assert:
    that:
      - netaut_wave | default('') | length > 0
    fail_msg: "live_guard: netaut_wave unset; pass -e netaut_wave=<wave record id>"

- name: Fetch post-wave running-config
  ansible.builtin.include_tasks: "{{ netaut_vendor }}/fetch.yml"
  vars:
    live_guard_fetch_to: "{{ netaut_run_dir }}/{{ inventory_hostname }}-post.{{ live_guard_ext }}"

- name: Build operational snapshot from running-config
  ansible.builtin.command:
    argv:
      - python3
      - "{{ live_guard_files }}/{{ netaut_vendor }}_snapshot.py"
      - --config
      - "{{ inventory_hostname }}={{ netaut_run_dir }}/{{ inventory_hostname }}-post.{{ live_guard_ext }}"
      - --out
      - "{{ netaut_run_dir }}/{{ inventory_hostname }}-post.json"
  delegate_to: localhost
  changed_when: false

- name: Post-check is drift against intended (rc 0 only)
  ansible.builtin.command:
    argv:
      - python3
      - "{{ live_guard_drift }}"
      - --intended
      - "{{ netaut_intended }}"
      - --operational
      - "{{ netaut_run_dir }}/{{ inventory_hostname }}-post.json"
      - --report
      - "{{ netaut_run_dir }}/{{ inventory_hostname }}-drift.md"
      - --device
      - "{{ inventory_hostname }}"
      - --fail-on-drift
  delegate_to: localhost
  changed_when: false
