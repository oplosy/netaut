---
# SR Linux restore (T-015): replace / with the backup in one commit, so the
# device lands exactly on the backup, not a merge of backup and wave (proven
# byte-equal on 26.7.2). The file lookup is data, not a template: braces in
# descriptions or banners reach the device verbatim (contract-tested).
# The replace itself is no_log (it carries the password hash), so the backup
# is parsed first by a step that prints only "OK" or the error type.
- name: Backup must parse before it replaces the datastore (fail closed)
  ansible.builtin.command:
    argv:
      - python3
      - "{{ live_guard_files }}/srlinux_snapshot.py"
      - --config
      - "{{ inventory_hostname }}={{ netaut_backup_file }}"
      - --out
      - "{{ netaut_run_dir }}/{{ inventory_hostname }}-backup-check.json"
  delegate_to: localhost
  changed_when: false

- name: Replace running datastore with backup
  nokia.srlinux.config:
    replace:
      - path: /
        value: "{{ lookup('ansible.builtin.file', netaut_backup_file) | from_json }}"
    save_when: never
  no_log: true
