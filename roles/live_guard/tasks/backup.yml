---
# Pre-wave backup (T-011, ADR-005). Runs before any change; a missing or
# empty backup stops the wave before the first config task.
- name: Require a vendor with a live implementation (fail closed)
  ansible.builtin.assert:
    that:
      - netaut_vendor in ['eos', 'srlinux']
    fail_msg: "live_guard: no live implementation for vendor {{ netaut_vendor }}"

- name: Require a wave id (fail closed)
  ansible.builtin.assert:
    that:
      - netaut_wave | default('') | length > 0
    fail_msg: "live_guard: netaut_wave unset; pass -e netaut_wave=<wave record id>"

- name: Ensure local backup and run directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0700"
  loop:
    - "{{ netaut_backup_dir }}"
    - "{{ netaut_run_dir }}"
  delegate_to: localhost
  changed_when: false

# Any extension counts: both labs use the same host names, so an eos backup
# (cfg) must also block the same wave id on srlinux (json) and vice versa.
- name: Find any existing backup for this wave
  ansible.builtin.find:
    paths: "{{ netaut_backup_dir }}"
    patterns: "{{ inventory_hostname }}-{{ netaut_wave }}.*"
  delegate_to: localhost
  register: live_guard_backup_prior

# A retried wave under the same id would overwrite the pristine backup with
# a half-changed config, and a later restore would land on that.
- name: Refuse to overwrite an existing backup (fail closed)
  ansible.builtin.assert:
    that:
      - live_guard_backup_prior.matched == 0
    fail_msg: "backup for wave {{ netaut_wave }} already exists on {{ inventory_hostname }}; use a new wave id"

- name: Take pre-wave backup
  ansible.builtin.include_tasks: "{{ netaut_vendor }}/backup.yml"

- name: Stat pre-wave backup
  ansible.builtin.stat:
    path: "{{ netaut_backup_dir }}/{{ inventory_hostname }}-{{ netaut_wave }}.{{ live_guard_ext }}"
  delegate_to: localhost
  register: live_guard_backup_stat

- name: Backup must exist and be non-empty (fail closed)
  ansible.builtin.assert:
    that:
      - live_guard_backup_stat.stat.exists
      - live_guard_backup_stat.stat.size > 0
    fail_msg: "pre-wave backup missing for {{ inventory_hostname }}; wave not started"

- name: Record backup path for restore
  ansible.builtin.set_fact:
    netaut_backup_file: "{{ live_guard_backup_stat.stat.path }}"
